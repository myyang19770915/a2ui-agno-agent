[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2ui-demo-backend"
version = "0.1.0"
description = "A2UI Protocol Demo - Agent Backend Server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0",
    "agno>=2.5.0",
    "litellm>=1.80.0",
    "anthropic>=0.90.0",
    "psycopg[binary]>=3.3.0",
    "sqlalchemy>=2.0.0",
]

[tool.uv]
dev-dependencies = []

[tool.setuptools]
py-modules = ["a2ui_builder", "agent", "init_database", "main"]
